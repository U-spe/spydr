  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "JetBrains Mono", monospace;
      color: var(--theme-text);
      overflow: hidden;
      background: var(--theme-background);
    }

    /* =========================================
       VENOMOUS PAGE
       ========================================= */

    .venomous-page {
      position: relative;
      width: 100%;
      height: 100vh;
      z-index: 1;
    }

    /* =========================================
       TOP BAR
       ========================================= */

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 0 16px;

      border-bottom: 1px solid var(--theme-border);

      background: color-mix(
        in srgb,
        var(--theme-surface) 78%,
        transparent
      );

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      color: var(--theme-muted);

      z-index: 50;
    }

    .topbar .left,
    .topbar .right {
      display: flex;
      align-items: center;
      gap: 12px;

      font-size: 13px;
    }

    .topbar .left i {
      color: var(--theme-primary);
      font-size: 17px;
    }

    #clock,
    #battery {
      color: var(--theme-text);
    }

    /* =========================================
       MAIN WRAPPER
       ========================================= */

    .wrap {
      position: relative;

      width: 100%;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 48px 20px 20px;

      z-index: 2;
    }

    /* =========================================
       CONSTRUCTION CARD
       ========================================= */

    .construction {
      width: min(900px, 92vw);

      padding: 70px 50px;

      background: color-mix(
        in srgb,
        var(--theme-surface) 90%,
        transparent
      );

      border: 1px solid var(--theme-border);

      border-radius: 20px;

      text-align: center;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 0 40px color-mix(
          in srgb,
          var(--theme-primary) 10%,
          transparent
        ),
        inset 0 0 0 1px color-mix(
          in srgb,
          var(--theme-text) 3%,
          transparent
        );

      position: relative;
      overflow: hidden;
    }

    /* Theme colored animated glow */

    .construction::before {
      content: "";

      position: absolute;
      inset: -50%;

      background:
        radial-gradient(
          circle at 20% 30%,
          color-mix(
            in srgb,
            var(--theme-primary) 12%,
            transparent
          ),
          transparent 30%
        ),
        radial-gradient(
          circle at 80% 70%,
          color-mix(
            in srgb,
            var(--theme-secondary) 12%,
            transparent
          ),
          transparent 30%
        );

      animation: constructionGlow 10s ease-in-out infinite alternate;

      pointer-events: none;
    }

    @keyframes constructionGlow {
      0% {
        transform: translate(-5%, -5%) rotate(0deg);
      }

      50% {
        transform: translate(5%, 5%) rotate(8deg);
      }

      100% {
        transform: translate(-3%, 7%) rotate(-5deg);
      }
    }

    .construction > * {
      position: relative;
      z-index: 1;
    }

    /* =========================================
       ICON
       ========================================= */

    .icon {
      width: 110px;
      height: 110px;

      margin: 0 auto 25px;

      border-radius: 50%;

      display: grid;
      place-items: center;

      background: color-mix(
        in srgb,
        var(--theme-primary) 10%,
        transparent
      );

      border: 1px solid color-mix(
        in srgb,
        var(--theme-primary) 35%,
        transparent
      );

      font-size: 52px;

      color: var(--theme-primary);

      box-shadow:
        0 0 30px color-mix(
          in srgb,
          var(--theme-primary) 15%,
          transparent
        );

      animation: iconFloat 4s ease-in-out infinite;
    }

    @keyframes iconFloat {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-7px);
      }
    }

    /* =========================================
       TEXT
       ========================================= */

    h1 {
      margin: 0;

      font-family: "Space Grotesk", sans-serif;

      font-size: clamp(42px, 7vw, 82px);

      line-height: 1;

      letter-spacing: 2px;

      color: var(--theme-text);
    }

    .status {
      margin-top: 10px;

      color: var(--theme-primary);

      text-transform: uppercase;

      letter-spacing: 4px;

      font-size: 13px;

      font-weight: 600;

      text-shadow:
        0 0 15px var(--theme-glow);
    }

    .desc {
      max-width: 620px;

      margin: 28px auto 40px;

      color: var(--theme-muted);

      font-size: 15px;

      line-height: 1.8;
    }

    /* =========================================
       HOME BUTTON
       ========================================= */

    .home-btn {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 10px;

      padding: 14px 28px;

      border-radius: 10px;

      border: 1px solid var(--theme-primary);

      background: transparent;

      color: var(--theme-primary);

      text-decoration: none;

      transition:
        background 0.25s ease,
        color 0.25s ease,
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .home-btn:hover {
      background: var(--theme-primary);

      color: var(--theme-background);

      transform: translateY(-2px);

      box-shadow:
        0 0 20px var(--theme-glow);
    }

    .home-btn:active {
      transform: translateY(0) scale(0.98);
    }

    /* =========================================
       FOOTER
       ========================================= */

    .footer-note {
      margin-top: 28px;

      color: var(--theme-muted);

      opacity: 0.55;

      font-size: 12px;
    }

    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 600px) {
      .construction {
        padding: 50px 25px;
      }

      .icon {
        width: 85px;
        height: 85px;
        font-size: 40px;
      }

      .desc {
        font-size: 13px;
        line-height: 1.7;
      }

      .home-btn {
        width: 100%;
        padding: 13px 18px;
      }
    }
  </style>

</head>

  <!-- =========================================
       CLOCK / BATTERY
       ========================================= -->

  <script>
    function updateClock() {
      const clock = document.getElementById("clock");

      if (!clock) return;

      const now = new Date();

      clock.textContent =
        now.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        });
    }

    updateClock();

    setInterval(updateClock, 1000);


    if (navigator.getBattery) {

      navigator.getBattery().then((battery) => {

        const batteryElement =
          document.getElementById("battery");

        if (!batteryElement) return;

        function updateBattery() {

          batteryElement.textContent =
            Math.floor(battery.level * 100) + "%";
        }

        updateBattery();

        battery.addEventListener(
          "levelchange",
          updateBattery
        );

      }).catch(() => {

        const batteryElement =
          document.getElementById("battery");

        if (batteryElement) {
          batteryElement.textContent = "N/A";
        }

      });

    } else {

      const batteryElement =
        document.getElementById("battery");

      if (batteryElement) {
        batteryElement.textContent = "N/A";
      }

    }
  </script>

name: Copy Bedrock backgrounds into SPYDR

on:
  push:
    paths:
      - ".github/workflows/sync-bedrock-backgrounds.yml"

permissions:
  contents: write

jobs:
  copy-backgrounds:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SPYDR
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the six Bedrock background videos
        run: |
          mkdir -p assets/images/themes
          for name in v1-b v2-b v3-b v4-b v5-b v6-b; do
            curl --fail --location --retry 3 \
              "https://raw.githubusercontent.com/U-spe/bedrock/main/assets/images/b/${name}.mp4" \
              --output "assets/images/themes/${name}.mp4"
          done

      - name: Commit the videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/themes/*.mp4
          if git diff --cached --quiet; then
            echo "Background videos are already up to date."
            exit 0
          fi
          git commit -m "bedrock brought six wallpapers to the party"
          git push origin main

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>spydr // lessons</title>

  <link
    rel="icon"
    href="/assets/images/favicon.png"
  />

  <link
    href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css"
    rel="stylesheet"
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@300;400;600&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="/css/games.css"
  />

  <link
    rel="stylesheet"
    href="/css/menu.css"
  />
</head>

<body>

  <!-- =========================
       PAGE LOADER
  ========================== -->

  <div id="loader"></div>


  <!-- =========================
       BACKGROUND EFFECTS
  ========================== -->

  <div id="bg-effects-container">

    <canvas id="stars-canvas"></canvas>

    <div id="fog-overlay"></div>

  </div>


  <!-- =========================
       TOP RIGHT BUTTONS
  ========================== -->

  <div class="top-right">

    <button onclick="go('/settings.html')">

      <i class="ri-settings-3-line"></i>

      settings

    </button>


    <button onclick="go('/login.html')">

      <i class="ri-login-box-line"></i>

      login

    </button>

  </div>


  <!-- =========================
       GLOBAL MENU
  ========================== -->

  <div id="global-menu"></div>


  <!-- =========================
       MAIN CONTENT
  ========================== -->

  <main class="center">


    <!-- =========================
         TOP BAR
    ========================== -->

    <div class="top-bar">


      <!-- SOURCE DROPDOWN -->

      <div class="dropdown">

        <button id="dropdownButton">

          <i class="ri-gamepad-line"></i>

          <span id="sourceText">
            loading...
          </span>

          <i class="ri-arrow-down-s-line"></i>

        </button>


        <div id="dropdownMenu"></div>

      </div>


      <!-- SEARCH -->

      <div class="search">

        <i class="ri-search-line"></i>

        <input
          id="search"
          type="text"
          autocomplete="off"
          placeholder="search lessons..."
        />

      </div>

    </div>


    <!-- =========================
         GAME GRID
    ========================== -->

    <div id="game-grid">
      loading...
    </div>

  </main>


  <!-- =========================
       GAME VIEW
  ========================== -->

  <div id="game-view">


    <!-- EXIT BAR -->

    <button id="closeGameBtn">

      <i class="ri-arrow-left-line"></i>

      exit

    </button>


    <!-- =========================
         GAME STAGE
    ========================== -->

    <div id="game-stage">


      <!-- =========================
           LOADING VIDEO
      ========================== -->

      <div id="game-loader">

        <video
          id="game-loading-video"
          muted
          loop
          playsinline
          preload="auto"
        >

          <source
            src="/assets/images/loading.mp4"
            type="video/mp4"
          />

        </video>

      </div>


      <!-- =========================
           GAME IFRAME
      ========================== -->

      <iframe
        id="game-frame"
        title="spydr game"
        allowfullscreen
        allow="fullscreen; gamepad"
      ></iframe>

    </div>

  </div>


  <!-- =========================
       SCRIPTS
  ========================== -->

  <script src="/assets/gameassets/lumin.min.js"></script>
  <script src="/js/lessons.js"></script>
  <script src="/js/globalmenu.js"></script>

  <script
    type="module"
    src="/js/global.js"
  ></script>


  <!-- =========================
       PAGE NAVIGATION
  ========================== -->

  <script>

    function go(page) {

      document.body.style.opacity = "0";

      setTimeout(() => {

        location.href = page;

      }, 300);

    }

  </script>

</body>
</html>

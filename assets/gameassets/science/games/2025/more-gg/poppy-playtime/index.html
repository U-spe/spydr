<head>
    
    <meta charset="utf-8">

</script>
	
</head>

<script src="./UnityLoader.js"></script>
<script src="./UnityProgress.js"></script>
<script src="./p-p.js"></script>
<script>
    var gameInstance = UnityLoader.instantiate("gameContainer", "./p-p.json", {
        onProgress: UnityProgress,
        Module: {
            onRuntimeInitialized: function() {
                UnityProgress(gameInstance, "complete")
            }
        }
    });
</script>

<body>
    <div class="logo-homepage" id="logo" style="position: absolute; top:10%; ">
        <a href="https://definitelyscience.com/"><button>
        <p>Definitely Science</p>
    </button></a>
    </div>
	
    <script>
        function checkScreenSize() {
            var hiddenBlock = document.querySelector('#logo');
            if (window.innerWidth > 1200) {
                hiddenBlock.style.display = "block";
            } else {
                hiddenBlock.style.display = "none";
            }
        }

        // Add an event listener to check the size whenever the window is load or réize
        window.addEventListener('load', checkScreenSize);
        window.addEventListener('resize', checkScreenSize);
        // Initial check when the page loads
        checkScreenSize();
    </script>
    <div class="webgl-content">
        <div id="gameContainer" style="width: 100%; height: 100%; margin: auto"></div>
    </div>
</body>


</html>

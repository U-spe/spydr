<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>i-ran test</title>
</head>
<body>

    <!-- This is where your Markdown will be rendered -->
    <div id="changelog"></div>

    <!-- Include the marked.js library -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <script>
        // Put your Markdown text right here
        const markdownText = `
# Changelog
- [x] project: test. if you find this its an easter egg
- [ ] new project: suck your goth mommy toes
        `;

        // Render the Markdown into the HTML div
        document.getElementById('changelog').innerHTML = marked.parse(markdownText);
    </script>
</body>
</html>

name: One-time Scramjet root import

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/merge-scramjet-root.yml"

permissions:
  contents: write

jobs:
  merge:
    if: github.event.head_commit.message == 'Import Scramjet into Spydr root'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Spydr (sparse, to avoid downloading unrelated large assets)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .editorconfig
            .github/ISSUE_TEMPLATE/01-site-support.yml
            .github/ISSUE_TEMPLATE/02-spec-divergence.yml
            .github/ISSUE_TEMPLATE/03-rewriter-divergence.yml
            .github/ISSUE_TEMPLATE/04-misc.md
            .github/ISSUE_TEMPLATE/config.yml
            .github/actions/setup-rewriter-toolchain/action.yml
            .github/workflows/main.yml
            .github/workflows/merge-scramjet-root.yml
            .gitignore
            .prettierignore
            README.md
            SPYDR_README.md
            assets/scramjet-mini-noalpha.png
            assets/scramjet-mini.png
            assets/scramjet-mini.svg
            assets/scramjet.png

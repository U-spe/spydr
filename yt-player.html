<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>YT Player | Spydr</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="/css/yt-player.css"
  >
</head>

<body>

  <div class="app">

    <header class="topbar">

      <div class="brand">

        <div class="brand-icon">
          <i class="ri-play-large-fill"></i>
        </div>

        <div>
          <h1>YT Player</h1>
          <span>spydr media</span>
        </div>

      </div>


      <div class="header-actions">

        <button
          id="historyButton"
          class="icon-btn"
          title="Watch history"
        >
          <i class="ri-history-line"></i>
        </button>

      </div>

    </header>


    <section class="search-area">

      <div class="search-bar">

        <i class="ri-search-line"></i>

        <input
          id="searchInput"
          type="text"
          placeholder="Search YouTube..."
          autocomplete="off"
        >

        <button
          id="clearSearchButton"
          class="clear-btn hidden"
          title="Clear"
        >
          <i class="ri-close-line"></i>
        </button>

        <button id="searchButton">
          Search
        </button>

      </div>

    </section>


    <main class="main-grid">

      <!-- PLAYER -->
      <section class="player-section">

        <div class="player-card">

          <!-- NOTHING SELECTED -->
          <div
            id="emptyPlayer"
            class="empty-player"
          >

            <div class="empty-logo">
              <i class="ri-video-line"></i>
            </div>

            <h2>YT Player</h2>

            <p>
              Search for a video and select it.
            </p>

          </div>


          <!-- SELECTED VIDEO -->
          <div
            id="selectedPlayer"
            class="selected-player hidden"
          >

            <div
              id="selectedPreview"
              class="selected-preview"
            >

              <img
                id="selectedThumbnail"
                src=""
                alt=""
              >

              <div class="preview-overlay">

                <button
                  id="playCurrentButton"
                  class="big-play-button"
                >
                  <i class="ri-play-fill"></i>
                  Play Video
                </button>

              </div>

            </div>


            <div class="player-info">

              <div class="player-title-row">

                <div>

                  <h2 id="currentTitle">
                    Video
                  </h2>

                  <p id="currentChannel">
                    Channel
                  </p>

                </div>


                <div class="status-pill" id="playerStatus">
                  ready
                </div>

              </div>


              <div class="timeline-info">

                <span id="currentDate"></span>

                <span id="currentVideoId"></span>

              </div>


              <div class="player-actions">

                <button id="copyButton">
                  <i class="ri-link"></i>
                  Copy Link
                </button>

                <button id="openYoutubeButton">
                  <i class="ri-external-link-line"></i>
                  YouTube
                </button>

              </div>

            </div>

          </div>


          <!-- MP4 PLAYER -->
          <div
            id="mp4Player"
            class="mp4-player hidden"
          >

            <video
              id="videoElement"
              controls
              playsinline
              preload="metadata"
            ></video>


            <div class="player-info">

              <div class="player-title-row">

                <div>

                  <h2 id="mp4Title">
                    Video
                  </h2>

                  <p id="mp4Channel">
                    Spydr video player
                  </p>

                </div>


                <button
                  id="closeMp4Button"
                  class="circle-button"
                  title="Back"
                >
                  <i class="ri-arrow-go-back-line"></i>
                </button>

              </div>

            </div>

          </div>

        </div>


        <div
          id="converterStatus"
          class="converter-status hidden"
        >

          <div class="spinner"></div>

          <div>

            <strong id="converterStatusTitle">
              Preparing video
            </strong>

            <span id="converterStatusText">
              Talking to the Spydr media server...
            </span>

          </div>

        </div>

      </section>


      <!-- RESULTS -->
      <section class="results-section">

        <div class="results-header">

          <div>

            <h2 id="resultsTitle">
              Search Results
            </h2>

            <p id="resultsSubtitle">
              Search YouTube to get started.
            </p>

          </div>

        </div>


        <div
          id="loadingState"
          class="loading hidden"
        >

          <div class="spinner"></div>

          searching...

        </div>


        <div
          id="errorState"
          class="error-state hidden"
        >

          <i class="ri-error-warning-line"></i>

          <strong>
            Search failed
          </strong>

          <span id="errorMessage"></span>

        </div>


        <div id="resultsGrid"></div>

      </section>

    </main>

  </div>


  <!-- HISTORY -->
  <aside
    id="historyPanel"
    class="side-panel"
  >

    <div class="panel-header">

      <div>

        <h2>History</h2>

        <p>Recently selected videos</p>

      </div>


      <button
        id="closeHistoryButton"
        class="icon-btn"
      >
        <i class="ri-close-line"></i>
      </button>

    </div>


    <div id="historyList"></div>


    <button
      id="clearHistoryButton"
      class="danger-button"
    >
      Clear History
    </button>

  </aside>


  <div
    id="overlay"
    class="overlay hidden"
  ></div>


  <script src="/js/yt-player.js"></script>

</body>
</html>
